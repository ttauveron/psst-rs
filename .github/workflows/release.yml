name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build
        shell: bash
        env:
          PSST_RS_BUILD_VERSION: ${{ github.event.release.tag_name }}
          PSST_RS_BUILD_COMMIT: ${{ github.sha }}
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Rename binary
        id: binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/psst-rs"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            dst="psst-rs-${{ matrix.target }}.exe"
            mv "${src}.exe" "$dst"
          else
            dst="psst-rs-${{ matrix.target }}"
            mv "$src" "$dst"
          fi
          echo "name=$dst" >> $GITHUB_OUTPUT

      - name: Upload release binary
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.binary.outputs.name }}
