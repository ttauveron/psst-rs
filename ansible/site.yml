- name: Configure Alpine VM for psst-rs
  hosts: alpine_web
  gather_facts: false

  pre_tasks:
    - name: Configure resolv.conf before bootstrapping Python
      ansible.builtin.raw: |
        cat > /etc/resolv.conf <<'EOF'
        {% for nameserver in psst_resolv_nameservers %}
        nameserver {{ nameserver }}
        {% endfor %}
        EOF
      become: true
      when: psst_manage_resolv_conf

    - name: Bootstrap python3 if missing
      ansible.builtin.raw: |
        if ! command -v python3 >/dev/null 2>&1; then
          attempt=0
          until apk add --no-cache python3; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              exit 1
            fi
            sleep 5
          done
        fi
      register: psst_python_bootstrap
      changed_when: psst_python_bootstrap.stdout != "" or psst_python_bootstrap.stderr != ""

    - name: Gather facts
      ansible.builtin.setup:

    - name: Read Terraform outputs when enabled
      ansible.builtin.command: tofu output -json
      args:
        chdir: "{{ playbook_dir }}/{{ psst_terraform_dir }}"
      delegate_to: localhost
      become: false
      register: psst_terraform_outputs_raw
      changed_when: false
      when: psst_use_terraform_outputs

    - name: Parse Terraform outputs
      ansible.builtin.set_fact:
        psst_terraform_outputs: "{{ psst_terraform_outputs_raw.stdout | from_json }}"
      when: psst_use_terraform_outputs

    - name: Derive deployment values from Terraform outputs
      ansible.builtin.set_fact:
        psst_domain: "{{ psst_terraform_outputs.cloudflare_hostname.value }}"
        psst_public_base_url: "https://{{ psst_terraform_outputs.cloudflare_hostname.value }}"
        psst_tls_cert_content: "{{ psst_terraform_outputs.cloudflare_origin_ca_certificate_pem.value }}"
        psst_tls_key_content: "{{ psst_terraform_outputs.cloudflare_origin_ca_private_key_pem.value }}"
      no_log: true
      when:
        - psst_use_terraform_outputs
        - psst_terraform_outputs.cloudflare_hostname.value is not none
        - psst_terraform_outputs.cloudflare_origin_ca_certificate_pem.value is not none
        - psst_terraform_outputs.cloudflare_origin_ca_private_key_pem.value is not none

    - name: Assert controller-side deployment binary exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/{{ psst_binary_src }}"
      delegate_to: localhost
      become: false
      register: psst_local_binary

    - name: Fail when local deployment binary is missing
      ansible.builtin.assert:
        that:
          - psst_local_binary.stat.exists
        fail_msg: "Missing local deployment artifact: {{ psst_local_binary.stat.path }}"

    - name: Assert controller-side TLS artifacts exist when not using Terraform outputs
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/{{ item }}"
      delegate_to: localhost
      become: false
      register: psst_local_tls_artifacts
      loop:
        - "{{ psst_tls_cert_src }}"
        - "{{ psst_tls_key_src }}"
      when: psst_tls_cert_content is not defined or psst_tls_key_content is not defined

    - name: Fail when local TLS artifacts are missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Missing local TLS artifact: {{ item.stat.path }}"
      loop: "{{ psst_local_tls_artifacts.results | default([]) }}"
      when: psst_tls_cert_content is not defined or psst_tls_key_content is not defined

    - name: Assert Turnstile keys are configured when creation is enabled
      ansible.builtin.assert:
        that:
          - psst_turnstile_site_key | trim | length > 0
          - psst_turnstile_secret_key | trim | length > 0
        fail_msg: "Turnstile keys must be provided when psst_enable_create is true."
      when: psst_enable_create

  tasks:
    - name: Persist resolv.conf for subsequent runs
      ansible.builtin.copy:
        dest: "/etc/resolv.conf"
        owner: root
        group: root
        mode: "0644"
        content: |
          {% for nameserver in psst_resolv_nameservers %}
          nameserver {{ nameserver }}
          {% endfor %}
      when: psst_manage_resolv_conf

    - name: Install runtime packages
      ansible.builtin.package:
        name: "{{ psst_packages }}"
        state: present
      register: psst_runtime_packages
      retries: 5
      delay: 5
      until: psst_runtime_packages is succeeded

    - name: Ensure psst-rs system group exists
      ansible.builtin.group:
        name: "{{ psst_app_group }}"
        system: true
        state: present

    - name: Ensure psst-rs system user exists
      ansible.builtin.user:
        name: "{{ psst_app_user }}"
        group: "{{ psst_app_group }}"
        home: "{{ psst_data_dir }}"
        create_home: false
        shell: "/sbin/nologin"
        system: true
        state: present

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ psst_config_dir }}"
          owner: root
          group: "{{ psst_app_group }}"
          mode: "0750"
        - path: "{{ psst_data_dir }}"
          owner: "{{ psst_app_user }}"
          group: "{{ psst_app_group }}"
          mode: "0750"
        - path: "{{ psst_log_dir }}"
          owner: "{{ psst_app_user }}"
          group: "{{ psst_app_group }}"
          mode: "0750"
        - path: "{{ psst_tls_dir }}"
          owner: root
          group: nginx
          mode: "0750"

    - name: Remove default nginx virtual host when present
      ansible.builtin.file:
        path: "/etc/nginx/http.d/default.conf"
        state: absent
      notify: Reload nginx

    - name: Install Rust application binary
      ansible.builtin.copy:
        src: "{{ psst_binary_src }}"
        dest: "{{ psst_binary_dest }}"
        owner: root
        group: root
        mode: "0755"
      notify: Restart psst-rs

    - name: Install TLS certificate
      ansible.builtin.copy:
        content: "{{ psst_tls_cert_content }}"
        dest: "{{ psst_tls_cert_dest }}"
        owner: root
        group: root
        mode: "0644"
      no_log: true
      notify: Reload nginx
      when: psst_tls_cert_content is defined

    - name: Install TLS certificate from local file
      ansible.builtin.copy:
        src: "{{ psst_tls_cert_src }}"
        dest: "{{ psst_tls_cert_dest }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx
      when: psst_tls_cert_content is not defined

    - name: Install TLS private key
      ansible.builtin.copy:
        content: "{{ psst_tls_key_content }}"
        dest: "{{ psst_tls_key_dest }}"
        owner: root
        group: nginx
        mode: "0640"
      no_log: true
      notify: Reload nginx
      when: psst_tls_key_content is defined

    - name: Install TLS private key from local file
      ansible.builtin.copy:
        src: "{{ psst_tls_key_src }}"
        dest: "{{ psst_tls_key_dest }}"
        owner: root
        group: nginx
        mode: "0640"
      no_log: true
      notify: Reload nginx
      when: psst_tls_key_content is not defined

    - name: Install application environment file
      ansible.builtin.template:
        src: "templates/psst-rs.env.j2"
        dest: "{{ psst_env_file }}"
        owner: root
        group: "{{ psst_app_group }}"
        mode: "0640"
      notify: Restart psst-rs

    - name: Install application launcher
      ansible.builtin.template:
        src: "templates/psst-rs-launcher.j2"
        dest: "{{ psst_launcher_dest }}"
        owner: root
        group: root
        mode: "0755"
      notify: Restart psst-rs

    - name: Install OpenRC service
      ansible.builtin.template:
        src: "templates/psst-rs.openrc.j2"
        dest: "{{ psst_openrc_service_path }}"
        owner: root
        group: root
        mode: "0755"
      notify: Restart psst-rs

    - name: Install nginx reverse proxy configuration
      ansible.builtin.template:
        src: "templates/nginx-psst.conf.j2"
        dest: "{{ psst_nginx_vhost_path }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable psst-rs service at boot
      ansible.builtin.service:
        name: "{{ psst_app_name }}"
        enabled: true

    - name: Enable nginx service at boot
      ansible.builtin.service:
        name: nginx
        enabled: true

    - name: Ensure psst-rs service is running
      ansible.builtin.service:
        name: "{{ psst_app_name }}"
        state: started

    - name: Ensure nginx service is running
      ansible.builtin.service:
        name: nginx
        state: started

  handlers:
    - name: Restart psst-rs
      ansible.builtin.service:
        name: "{{ psst_app_name }}"
        state: restarted

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      listen: Reload nginx
      changed_when: false

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      listen: Reload nginx
